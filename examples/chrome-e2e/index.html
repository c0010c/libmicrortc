<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>libmicrortc Chrome E2E</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #1f2933;
        --muted: #64748b;
        --border: #d8dee8;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --ok: #15803d;
        --warn: #b45309;
        --bad: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .mode {
        color: var(--muted);
        font-size: 13px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      button {
        min-height: 40px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 0 16px;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:disabled {
        border-color: #aab4c3;
        background: #aab4c3;
        cursor: default;
      }

      .status-line {
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
        gap: 16px;
        align-items: start;
      }

      .media {
        display: grid;
        gap: 12px;
      }

      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      audio {
        width: 100%;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .statuses {
        display: grid;
        gap: 8px;
      }

      .status-row {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        font-size: 14px;
      }

      .label {
        color: var(--muted);
      }

      .badge {
        min-height: 24px;
        border-radius: 999px;
        background: #eef2f7;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        max-width: 100%;
        padding: 2px 10px;
        overflow-wrap: anywhere;
      }

      .badge.ok {
        background: #dcfce7;
        color: var(--ok);
      }

      .badge.warn {
        background: #fef3c7;
        color: var(--warn);
      }

      .badge.bad {
        background: #fee2e2;
        color: var(--bad);
      }

      .events {
        margin: 12px 0 0;
        max-height: 240px;
        overflow: auto;
        padding: 0;
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: #334155;
      }

      .events li {
        border-top: 1px solid #edf1f6;
        padding: 7px 0;
        overflow-wrap: anywhere;
      }

      @media (max-width: 760px) {
        main {
          width: min(100vw - 20px, 1180px);
          padding: 14px 0;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .status-row {
          grid-template-columns: 92px minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1>libmicrortc Chrome E2E</h1>
        <div id="mode" class="mode">host</div>
      </div>
      <div class="toolbar">
        <button id="start-button" type="button">开始拉流</button>
        <span id="status-line" class="status-line">等待启动</span>
      </div>
      <div class="grid">
        <section class="media">
          <video id="remote-video" playsinline autoplay muted></video>
          <audio id="remote-audio" autoplay controls></audio>
        </section>
        <aside class="panel">
          <h2>状态</h2>
          <div class="statuses">
            <div class="status-row"><span class="label">WebSocket</span><span id="status-ws" class="badge">idle</span></div>
            <div class="status-row"><span class="label">Peer</span><span id="status-peer" class="badge">new</span></div>
            <div class="status-row"><span class="label">ICE</span><span id="status-ice" class="badge">new</span></div>
            <div class="status-row"><span class="label">DataChannel</span><span id="status-data" class="badge">new</span></div>
            <div class="status-row"><span class="label">浏览器视频</span><span id="status-video" class="badge">pending</span></div>
            <div class="status-row"><span class="label">浏览器音频</span><span id="status-audio" class="badge">pending</span></div>
            <div class="status-row"><span class="label">C 端媒体</span><span id="status-cmedia" class="badge">pending</span></div>
          </div>
          <ul id="events" class="events" aria-live="polite"></ul>
        </aside>
      </div>
    </main>
    <script src="./browser-client.js"></script>
  </body>
</html>
