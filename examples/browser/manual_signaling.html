<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>rtc-s1 DataChannel Manual Signaling</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #102a43;
      --accent: #d64545;
      --line: #d9cfc2;
    }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 0% 0%, #fff4d6 0%, var(--bg) 40%, #efe9dd 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 24px auto; padding: 0 16px 40px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .hint { margin: 0 0 18px; opacity: .8; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 26px rgba(16,42,67,.06);
    }
    label { display: block; font-weight: 600; margin: 8px 0; }
    textarea {
      width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: vertical; background: #fff;
    }
    input {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px; box-sizing: border-box; margin-bottom: 8px;
    }
    button {
      border: 0; background: var(--accent); color: #fff; border-radius: 8px;
      padding: 8px 12px; cursor: pointer; margin-right: 8px; margin-bottom: 8px;
    }
    .log {
      min-height: 140px; max-height: 260px; overflow: auto; background: #fff;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>rtc-s1 DataChannel Manual Signaling</h1>
    <p class="hint">步骤：Create Offer（自动等 ICE）-> 复制 Offer SDP 给设备 -> 粘贴设备 Answer SDP -> Apply。</p>
    <div class="grid">
      <section class="card">
        <label>Local Offer SDP (send to device)</label>
        <textarea id="localOffer"></textarea>
        <label>Remote Answer SDP (paste from device)</label>
        <textarea id="remoteAnswer"></textarea>
        <button id="btnCreate">Create Offer</button>
        <button id="btnApply">Apply Answer</button>
      </section>
      <section class="card">
        <label>Send Message</label>
        <input id="msg" value="hello from browser" />
        <button id="btnSend">Send</button>
        <button id="btnOpen">Open DataChannel</button>
        <label>Log</label>
        <div id="log" class="log"></div>
      </section>
    </div>
  </div>

  <script>
    let pc = null;
    let dc = null;

    const logEl = document.getElementById('log');
    const offerEl = document.getElementById('localOffer');
    const answerEl = document.getElementById('remoteAnswer');

    function log(s) {
      const line = `[${new Date().toISOString()}] ${s}`;
      logEl.textContent += `${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }
    log(`UA: ${navigator.userAgent}`);

    function extractCandidates(sdp) {
      const out = [];
      if (!sdp) return out;
      for (const line of sdp.split(/\r?\n/)) {
        if (line.startsWith('a=candidate:')) {
          out.push(line.substring(2));
        }
      }
      return out;
    }

    function stripCandidateLines(sdp) {
      const kept = [];
      if (!sdp) return sdp;
      for (const line of sdp.split(/\r?\n/)) {
        if (line.startsWith('a=candidate:')) continue;
        if (line.startsWith('a=end-of-candidates')) continue;
        kept.push(line);
      }
      return ensureSdpTerminated(kept.join('\r\n'));
    }

    function normalizeCandidate(c) {
      const m = c.match(/^candidate:(\S+)\s+(\d+)\s+(\S+)\s+(\d+)\s+(\S+)\s+(\d+)\s+typ\s+(\S+)(.*)$/i);
      if (!m) return c;
      return `candidate:${m[1]} ${m[2]} udp ${m[4]} ${m[5]} ${m[6]} typ ${m[7].toLowerCase()}${m[8] || ''}`;
    }

    function normalizeSdpText(raw) {
      if (!raw) return '';
      const logical = [];
      let s = String(raw)
        .replace(/\uFEFF/g, '')
        .replace(/\\r\\n/g, '\n')
        .replace(/\\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/[^\x09\x0A\x0D\x20-\x7E]/g, '');
      /* Recover from one-line paste where SDP line breaks were flattened into spaces. */
      s = s.replace(/([^\r\n])([vostamcb]=)/g, '$1\n$2');
      for (const line of s.split('\n')) {
        const t = line.trim();
        if (!t) continue;
        if (t.startsWith('```')) continue;
        if (/^[a-z]=/i.test(t)) logical.push(t);
      }
      return ensureSdpTerminated(logical.join('\r\n'));
    }

    function ensureSdpTerminated(sdp) {
      const normalized = String(sdp || '').replace(/\r?\n/g, '\r\n').trim();
      if (!normalized) return '';
      return normalized.endsWith('\r\n') ? normalized : `${normalized}\r\n`;
    }

    function adaptAnswerSctpToOffer(answerSdp, offerSdp) {
      let s = normalizeSdpText(answerSdp);
      const normalizedOffer = normalizeSdpText(offerSdp);
      const legacyOffer = /m=application .* DTLS\/SCTP /mi.test(normalizedOffer) || /a=sctpmap:/mi.test(normalizedOffer);
      return legacyOffer ? forceLegacySctp(s) : forceModernSctp(s);
    }

    function forceLegacySctp(answerSdp) {
      let s = answerSdp;
      s = s.replace(/^m=application .*$/m, 'm=application 9 DTLS/SCTP 5000');
      s = s.replace(/^a=sctp-port:\d+.*$/gm, '');
      s = s.replace(/^a=sctpmap:\d+.*$/m, 'a=sctpmap:5000 webrtc-datachannel 1024');
      if (!/^a=sctpmap:/m.test(s)) {
        s += '\r\na=sctpmap:5000 webrtc-datachannel 1024';
      }
      return s;
    }

    function forceModernSctp(answerSdp) {
      let s = answerSdp;
      s = s.replace(/^m=application .*$/m, 'm=application 9 UDP/DTLS/SCTP webrtc-datachannel');
      s = s.replace(/^a=sctpmap:\d+.*$/gm, '');
      s = s.replace(/^a=sctp-port:\d+.*$/m, 'a=sctp-port:5000');
      if (!/^a=sctp-port:/m.test(s)) {
        s += '\r\na=sctp-port:5000';
      }
      return s;
    }

    function collectAnswerFields(answerSdp) {
      const lines = normalizeSdpText(answerSdp).split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const out = {
        v: 'v=0',
        o: 'o=- 0 0 IN IP4 127.0.0.1',
        s: 's=rtc-s1',
        t: 't=0 0',
        group: 'a=group:BUNDLE 0',
        c: 'c=IN IP4 0.0.0.0',
        mid: 'a=mid:0',
        setup: 'a=setup:passive',
        fingerprint: '',
        iceUfrag: '',
        icePwd: ''
      };
      for (const line of lines) {
        if (/^v=/i.test(line)) out.v = line;
        else if (/^o=/i.test(line)) out.o = line;
        else if (/^s=/i.test(line)) out.s = line;
        else if (/^t=/i.test(line)) out.t = line;
        else if (/^a=group:/i.test(line)) out.group = line;
        else if (/^c=/i.test(line)) out.c = line;
        else if (/^a=mid:/i.test(line)) out.mid = line;
        else if (/^a=setup:/i.test(line)) out.setup = line;
        else if (/^a=fingerprint:/i.test(line)) out.fingerprint = line;
        else if (/^a=ice-ufrag:/i.test(line)) out.iceUfrag = line;
        else if (/^a=ice-pwd:/i.test(line)) out.icePwd = line;
      }
      return out;
    }

    function buildCanonicalAnswer(answerSdp, mode) {
      const f = collectAnswerFields(answerSdp);
      const mline = (mode === 'legacy' || mode === 'legacy-port')
        ? 'm=application 9 DTLS/SCTP 5000'
        : 'm=application 9 UDP/DTLS/SCTP webrtc-datachannel';
      const sctp = (mode === 'legacy' || mode === 'modern-map')
        ? 'a=sctpmap:5000 webrtc-datachannel 1024'
        : 'a=sctp-port:5000';
      const lines = [
        f.v,
        f.o,
        f.s,
        f.t,
        f.group,
        mline,
        f.c,
        f.mid,
        f.setup,
        f.fingerprint,
        f.iceUfrag,
        f.icePwd,
        sctp
      ].filter(Boolean);
      return ensureSdpTerminated(lines.join('\r\n'));
    }

    function buildTemplateAnswerFromOffer(offerSdp, answerSdp) {
      const oLines = normalizeSdpText(offerSdp).split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const f = collectAnswerFields(answerSdp);
      const out = [];
      for (const line of oLines) {
        if (/^a=candidate:/i.test(line)) continue;
        if (/^a=end-of-candidates/i.test(line)) continue;
        if (/^a=max-message-size:/i.test(line)) continue;
        if (/^a=ice-options:/i.test(line)) continue;
        if (/^a=extmap-allow-mixed$/i.test(line)) continue;
        if (/^a=msid-semantic:/i.test(line)) continue;
        if (/^m=application /i.test(line)) {
          out.push('m=application 9 UDP/DTLS/SCTP webrtc-datachannel');
          continue;
        }
        if (/^c=/i.test(line)) {
          out.push('c=IN IP4 0.0.0.0');
          continue;
        }
        if (/^a=setup:/i.test(line)) {
          out.push(f.setup || 'a=setup:passive');
          continue;
        }
        if (/^a=fingerprint:/i.test(line)) {
          out.push(f.fingerprint || line);
          continue;
        }
        if (/^a=ice-ufrag:/i.test(line)) {
          out.push(f.iceUfrag || line);
          continue;
        }
        if (/^a=ice-pwd:/i.test(line)) {
          out.push(f.icePwd || line);
          continue;
        }
        out.push(line);
      }
      return ensureSdpTerminated(out.join('\r\n'));
    }

    function waitIceComplete(pc, timeoutMs = 5000) {
      if (pc.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const timer = setTimeout(() => {
          pc.removeEventListener('icegatheringstatechange', onChange);
          resolve();
        }, timeoutMs);
        function onChange() {
          if (pc.iceGatheringState === 'complete') {
            clearTimeout(timer);
            pc.removeEventListener('icegatheringstatechange', onChange);
            resolve();
          }
        }
        pc.addEventListener('icegatheringstatechange', onChange);
      });
    }

    async function logTransportStats(tag) {
      if (!pc) return;
      try {
        const stats = await pc.getStats();
        let pair = null;
        stats.forEach((r) => {
          if (r.type !== 'candidate-pair') return;
          if (r.selected || r.nominated) {
            pair = r;
            return;
          }
          if (!pair && r.state === 'succeeded') {
            pair = r;
          }
        });
        if (!pair) {
          log(`Stats[${tag}] no selected candidate pair`);
          return;
        }
        const local = pair.localCandidateId ? stats.get(pair.localCandidateId) : null;
        const remote = pair.remoteCandidateId ? stats.get(pair.remoteCandidateId) : null;
        log(`Stats[${tag}] pair state=${pair.state || '-'} nominated=${pair.nominated ? 1 : 0} requestsSent=${pair.requestsSent ?? '-'} responsesReceived=${pair.responsesReceived ?? '-'} bytesSent=${pair.bytesSent ?? '-'} bytesReceived=${pair.bytesReceived ?? '-'}`);
        if (local || remote) {
          log(`Stats[${tag}] local=${local ? `${local.address || local.ip || '-'}:${local.port || '-'}/${local.candidateType || '-'}` : '-'} remote=${remote ? `${remote.address || remote.ip || '-'}:${remote.port || '-'}/${remote.candidateType || '-'}` : '-'}`);
        }
      } catch (e) {
        log(`Stats[${tag}] failed: ${e}`);
      }
    }

    function ensurePC() {
      if (pc) return;
      pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] });

      pc.onicecandidate = (ev) => {
        if (ev.candidate) {
          log(`Local candidate: ${ev.candidate.candidate}`);
        }
      };
      pc.oniceconnectionstatechange = () => log(`ICE state: ${pc.iceConnectionState}`);
      pc.onconnectionstatechange = async () => {
        log(`PC state: ${pc.connectionState}`);
        if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          await logTransportStats(`pc-${pc.connectionState}`);
        }
      };
      pc.ondatachannel = (ev) => { dc = ev.channel; wireDC(); };
    }

    function wireDC() {
      if (!dc) return;
      dc.onopen = () => log(`DC open: ${dc.label}`);
      dc.onclose = () => log(`DC close: ${dc.label}`);
      dc.onmessage = (ev) => log(`RX: ${ev.data}`);
    }

    document.getElementById('btnOpen').onclick = async () => {
      ensurePC();
      if (!dc) {
        dc = pc.createDataChannel('chat', { ordered: true });
        wireDC();
        log('Created local datachannel: chat');
      }
    };

    document.getElementById('btnCreate').onclick = async () => {
      ensurePC();
      if (!dc) {
        dc = pc.createDataChannel('chat', { ordered: true });
        wireDC();
      }
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceComplete(pc);
      offerEl.value = pc.localDescription.sdp;
      log('Offer SDP ready with local candidates. Copy to device.');
    };

    document.getElementById('btnApply').onclick = async () => {
      try {
        ensurePC();
        const answerSdp = normalizeSdpText(answerEl.value);
        if (!answerSdp) {
          log('Remote answer SDP is empty');
          return;
        }
        answerEl.value = answerSdp;
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        log('setRemoteDescription succeeded with raw normalized answer');

        const candidates = extractCandidates(answerSdp).map(normalizeCandidate);
        for (const c of candidates) {
          try {
            await pc.addIceCandidate({ candidate: c, sdpMid: '0', sdpMLineIndex: 0 });
          } catch (e) {
            log(`addIceCandidate failed: ${e}`);
          }
        }
        log(`Remote answer applied (${candidates.length} candidate(s) parsed).`);
        await logTransportStats('after-apply');
      } catch (e) {
        log(`Apply answer failed: ${e}`);
        await logTransportStats('apply-failed');
        console.error(e);
      }
    };

    document.getElementById('btnSend').onclick = () => {
      if (!dc || dc.readyState !== 'open') {
        log('DataChannel not open');
        return;
      }
      const msg = document.getElementById('msg').value;
      dc.send(msg);
      log(`TX: ${msg}`);
    };
  </script>
</body>
</html>
